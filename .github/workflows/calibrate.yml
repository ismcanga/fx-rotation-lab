name: Calibrate FX profiles

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrate:
    name: Run FX calibration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run calibration
        shell: bash
        run: |
          set -euo pipefail
          python3 backoffice/calibrate.py | tee calibration.log

      - name: Upload calibration result
        uses: actions/upload-artifact@v4
        with:
          name: fx-calibration-${{ github.run_number }}
          path: |
            profiles.json
            calibration.log
          if-no-files-found: error
          retention-days: 30
